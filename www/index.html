<!-- TELA DA LOJA -->
<div id="screen-shop" class="screen">
  <h1>Loja do Sistema</h1>
  <div class="subtitle">Suas Moedas: <span id="shop-coins">100</span> DATA</div>
  
  <div class="scroll-container" style="display: flex; flex-direction: column; gap: 12px; width: 100%; padding: 10px;">
    
    <div style="background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(6, 182, 212, 0.3); border-radius: 12px; padding: 14px; display: flex; justify-content: space-between; align-items: center; width: 100%;">
      <div style="text-align: left;">
        <div style="font-weight: bold; color: #38bdf8;">Recuperar HP</div>
        <div style="font-size: 0.75rem; color: #94a3b8;">Cura 100% da vida</div>
      </div>
      <button onclick="buyItem('heal')" style="background: #0284c7; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold;">30 DATA</button>
    </div>

    <div style="background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(6, 182, 212, 0.3); border-radius: 12px; padding: 14px; display: flex; justify-content: space-between; align-items: center; width: 100%;">
      <div style="text-align: left;">
        <div style="font-weight: bold; color: #38bdf8;">Recarregar Energia</div>
        <div style="font-size: 0.75rem; color: #94a3b8;">Pronto para combate</div>
      </div>
      <button onclick="buyItem('energy')" style="background: #0284c7; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold;">20 DATA</button>
    </div>

    <div style="background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(6, 182, 212, 0.3); border-radius: 12px; padding: 14px; display: flex; justify-content: space-between; align-items: center; width: 100%;">
      <div style="text-align: left;">
        <div style="font-weight: bold; color: #38bdf8;">Boost de XP</div>
        <div style="font-size: 0.75rem; color: #94a3b8;">Ganha +50 XP imediato</div>
      </div>
      <button onclick="buyItem('xp')" style="background: #0284c7; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold;">50 DATA</button>
    </div>

    <div style="background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(6, 182, 212, 0.3); border-radius: 12px; padding: 14px; display: flex; justify-content: space-between; align-items: center; width: 100%;">
      <div style="text-align: left;">
        <div style="font-weight: bold; color: #38bdf8;">Patrocínio da Rede (Anúncio)</div>
        <div style="font-size: 0.75rem; color: #94a3b8;">Assista para receber +50 DATA</div>
      </div>
      <button onclick="window.watchAdReward()" style="background: #0284c7; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer;">Ver Anúncio</button>
    </div>

    <button onclick="changeScreen('menu')" style="width: 100%; background: #6366f1; color: white; border: none; padding: 12px; border-radius: 12px; font-weight: bold; margin-top: 10px;">VOLTAR</button>

  </div>
</div>
